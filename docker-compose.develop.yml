name: maple-develop

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: maple_develop
      POSTGRES_USER: maple_develop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple_develop -d maple_develop"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [local]

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [local]

  app:
    image: maple-develop-app:${BUILD_SHA:?BUILD_SHA is required}
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/maple_develop
      SPRING_DATASOURCE_USERNAME: maple_develop
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NEXON_API_KEY_SECRET: ${NEXON_API_KEY_SECRET:?NEXON_API_KEY_SECRET is required}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      KAKAO_REDIRECT_URI: http://localhost:3000/auth/callback
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_SCHEDULING_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks: [local]

  frontend:
    image: maple-develop-frontend:${BUILD_SHA:?BUILD_SHA is required}
    build:
      context: .
      dockerfile: frontend/Dockerfile.develop
      args:
        KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [local]

networks:
  local:

volumes:
  postgres_data:
  redis_data:
